# The recipe's defaults. `local.toml` next to this file overrides them for one machine (copy local.example.toml); an
# environment variable of the same name in upper case overrides both (PORT=30200 python3 -m rtx up).

[model]
# Zyphra's release as published (Apache-2.0; nothing is converted). `python3 -m rtx fetch` downloads the 15 GB the
# server reads: hf download <model_repo> --revision <model_revision> --local-dir <model_dir> --include ...
model_repo = "Zyphra/ZONOS3-Mini"
model_revision = "d2d142a86b1e6aeb4252679673c86ecd86177bf8"
served_name = "zonos3-mini"
model_dir = "~/models/ZONOS3-Mini"

[engine]
# TensorFold's native CUDA engine with the zonos3 family and the encoded reply formats: a worktree of tensorfold_src
# at tensorfold_sha, built by `python3 -m rtx build` under tf_cache; `binary` names a built tensorfold-native instead
tensorfold_src = "~/github/TensorFold"   # a clone holding tensorfold_sha (made by `build` if it is missing)
tensorfold_sha = "c8c90565af388c54380a3600218085f97bfe424a"   # tag zonos3-openai-c8c90565a (engine.py fetches it)
zig = "zig"                              # Zig 0.17.0
nvcc = "/usr/local/cuda/bin/nvcc"        # CUDA 13
sm = "120"                               # the card's architecture: 120 is the RTX 50 series, the only one run
cargo = "cargo"                          # Rust 1.88 or later, for the text normalizer; without it text is spoken as typed
binary = ""

[local]
host = "127.0.0.1"        # 0.0.0.0 serves the LAN; set api_key then
port = 30117              # the API: /v1/audio/speech, /v1/voices, /v1/models
page_port = 30118         # the browser test page (0: no page)
page_bind = "127.0.0.1"   # 0.0.0.0 lets other machines open the page, which has no password
tf_cache = "~/.cache/zonos3-mini"

[serve]
parallel = 4              # requests at once (1 to 16): 3.6 GiB of the card at 1, 1.2 GiB more for each one past it
api_key = ""
extra_args = ""
